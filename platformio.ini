; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.partitions = huge_app.csv ; Unlock second 4MB half of flash memory

; Ports
upload_port = COM4
monitor_port = COM4

; Serial Monitor speed for debugging
monitor_speed = 115200

; Debugging
upload_speed = 115200

; ---------------------------------------------------------
; LIBRARY DEPENDENCIES
; ---------------------------------------------------------
lib_deps =
  ; Display & Graphics Engines
  bodmer/TFT_eSPI
  lvgl/lvgl @ ^8.3.11 ; Downgraded for a stable ESP32 version (newest 9.5.0)
  
  ; Network & API Processing
  bblanchon/ArduinoJson
  
  ; BME680 Sensor Drivers
  boschsensortec/BSEC Software Library
  adafruit/Adafruit BME680 Library

; ---------------------------------------------------------
; COMPILER BUILD FLAGS (Hardware Pin Definitions)
; ---------------------------------------------------------
build_flags =
  -I include
  ; Tell TFT_eSPI to ignore its internal User_Setup.h file
  -D USER_SETUP_LOADED=1
  
  ; --- DISPLAY CONFIGURATION ---
  -D ILI9488_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  
  ; --- SPI PIN MAPPING ---
  -D TFT_MOSI=23
  -D TFT_MISO=19
  -D TFT_SCLK=18
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=4
  -D TOUCH_CS=33
  
  ; --- LVGL & PERFORMANCE FLAGS ---
  -D LV_CONF_INCLUDE_SIMPLE=1
  -D LV_DRAW_COMPLEX=1
  -D SPI_FREQUENCY=27000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1